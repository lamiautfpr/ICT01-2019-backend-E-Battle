openapi: 3.0.3
info:
  title: Ebattle Api
  description: Api para integração de uma plataforma web com o projeto ICT01-2019 E-Battle que, por sua vez, é um jogo educacional que tem como objetivo estimular o aprendizado em sala de aula por meio da competição saudável entre os jogadores.
  version: 1.0.0
servers:
  - url: 'https://api.ebattle.lamia-edu.com/{{env}}'
paths:
  /contact:
    get:
      tags:
        - Contact
      description: Retorna os contatos realizados
      operationId: getContact
      responses:
        '200':
          description: Informações de contato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactsListResponse'
    post:
      tags:
        - Contact
      description: Envia uma mensagem de contato para o suporte
      operationId: contact
      requestBody:
        description: Mensagem a ser enviada
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Contact'
        required: true
      responses:
        '200':
          description: Mensagem enviada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactsResponse'
  /register:
    post:
      tags:
        - Authentication
      description: Registra um usuário no sistema
      operationId: register
      requestBody:
        description: Dados de registro
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
        required: true
      responses:
        '200':
          description: Usuário registrado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterResponse'
  /mails/registermail:
    post:
      tags:
        - Emails
      description: Registra e ja envia o email de convite
      operationId: emailRegister
      requestBody:
        description: Email a registrar
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterEmail'
        required: true
      responses:
        '200':
          description: Email registrado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterEmailResponse'
      security:
        - authToken: [ ]
  /mails/invite:
    post:
      tags:
        - Emails
      description: Envia o convite para emails ja registrados a lista
      operationId: emailRegister2
      requestBody:
        description: Email a registrar
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReSendEmails'
        required: true
      responses:
        '200':
          description: Email registrado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReSendEmailsResponse'
      security:
        - authToken: [ ]
  /mails/recovery:
    post:
      tags:
        - Emails
      description: Envia o email de recuperação de senha
      operationId: emailRecovery
      requestBody:
        description: Email que vai trocar a senha
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterEmail'
        required: true
      responses:
        '200':
          description: Email enviado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterEmailResponse'
      security:
        - authToken: [ ]
  /mails/verify:
    get:
      tags:
        - Emails
      description: Valida um email
      operationId: validEmail
      parameters:
        - name: email
          in: query
          description: Email a ser verificado
          schema:
            type: string
            example: teste@gmail.com
      responses:
        '200':
          description: status do email
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyEmailResponse'
      security:
        - authToken: [ ]
  /mails:
    delete:
      tags:
        - Emails
      description: Deleta um email
      operationId: deleteEmail
      parameters:
        - name: email
          in: query
          description: email a ser deletado
          schema:
            type: string
            example: teste@gmail.com
      responses:
        '200':
          description: Email deletado
      security:
        - authToken: [ ]
  /login:
    post:
      tags:
        - Authentication
      description: Autentica um usuário no sistema
      operationId: login
      requestBody:
        description: Dados de autenticação
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      responses:
        '200':
          description: Usuário autenticado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
  /categories:
    get:
      tags:
        - Creation options
      description: Retorna as categorias do jogo, com base no id enviado, pega da categoria abaixo todos referentes ao id solicitado
      operationId: getCategories
      parameters:
        - name: teaching_levels_id
          in: query
          description: Id do nivel de ensino, retorna os temas do nivel de ensino selecionado
          schema:
            type: integer
            example: 5
        - name: games_theme_id
          in: query
          description: Id do tema do jogo, retorna as categorias do tema selecionado
          schema:
            type: integer
            example:
        - name: category_id
          in: query
          description: Id da categoria do jogo, retorna as subcategorias da categoria selecionada
          schema:
            type: integer
            example:
      responses:
        '200':
          description: Lista de categorias
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoriesResponse'
      security:
        - authToken: [ ]
  /languages:
    get:
      tags:
        - Creation options
      description: Retorna as linguages
      operationId: getLanguages
      responses:
        '200':
          description: Lista linguagens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LanguagesResponse'
      security:
        - authToken: [ ]
  /users:
    get:
      tags:
        - Users
      description: Mostra as informações do usuario logado
      operationId: selectUser
      responses:
        '200':
          description: Informações do usuario logado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SelectUserResponse'
      security:
        - authToken: [ ]
    put:
      tags:
        - Users
      description: Edita as informações de um usuario
      operationId: editUser
      requestBody:
        description: Informações que serão alteradas
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditUser'
      responses:
        '200':
          description: Informações do usuario editado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditUserResponse'
      security:
        - authToken: [ ]
    post:
      tags:
        - Users
      description: Altera a senha de um usuario
      operationId: userUpdatePassword
      requestBody:
        description: Informações que serão alteradas
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditPasswordUser'
      responses:
        '200':
          description: Informações do usuário editado com sucesso.
    delete:
      tags:
        - Users
      description: Deleta um usuario
      operationId: deleteUser
      responses:
        '200':
          description: Usuario deletado
      security:
        - authToken: [ ]
  /instituitions:
    get:
      tags:
          - Instituitions
      description: Mostra as instituições disponiveis
      operationId: selectInstituitions
      responses:
        '200':
          description: Instituições cadastradas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SelectInstituitionsResponse'
      security:
        - authToken: [ ]
    post:
      tags:
          - Instituitions
      description: Cadastra uma nova instituição
      operationId: createInstituitions
      requestBody:
        description: Dados da instituição a ser cadastrada
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Instituitions'
        required: true
      responses:
        '200':
          description: Instituição cadastrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SelectInstituitionResponse'
      security:
        - authToken: [ ]
  /instituitions/users:
    get:
      tags:
          - Instituitions
      description: Mostra os usuarios da instituição do usuario logado
      operationId: selectUsersInstituition
      responses:
        '200':
          description: Usuarios cadastrados na instituição
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SelectAllInstituitionUsersResponse'
      security:
        - authToken: [ ]  
  /instituitions/mails:
    get:
      tags:
        - Instituitions
      description: Retorna os emails de uma instituição
      operationId: getEmails
      responses:
        '200':
          description: Lista de informações dos emails
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SelectEmailsResponse'
      security:
        - authToken: [ ]
  /roles:
      get:
        tags:
            - Creation options
        description: Mostra as roles disponiveis
        operationId: selectRoles
        responses:
          '200':
            description: Roles cadastradas
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/SelectRolesResponse'
        security:
          - authToken: [ ]
  /matches:
    get:
      tags:
        - Matches
      description: Retorna um match de acordo com o id
      operationId: getMatch
      parameters:
        - name: id
          in: query
          description: Id do game para realizar o match
          schema:
            type: number
            example: 1
      responses:
        '200':
          description: Retorna o match de um game
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchesResponse'
      security:
        - authToken: []
    post:
      tags:
        - Matches
      description: Salva as informações ao final do jogo
      operationId: saveMatch
      requestBody:
        description: Dados do jogo a ser criado
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveMatch'
        required: true
      responses:
        '200':
          description: Success!
      security:
        - authToken: []
  /matches/start:
    post:
      tags:
        - Matches
      description: Inicia um match
      operationId: startMatch
      requestBody:
        description: Dados do match a ser criado
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartMatch'
        required: true
      responses:
        '200':
          description: Match realizado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartMatchResponse'
      security:
        - authToken: [ ]
  /matches/result:
    get:
      tags:
        - Matches
      description: Inicia um match
      operationId: getMatchResult
      parameters:
        - name: id
          in: query
          description: Id do game para realizar o match
          schema:
            type: number
            example: 1
      responses:
        '200':
          description: Dados do resultado do jogo (Match)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchesResultResponse'
      security:
        - authToken: [ ]
  /games:
    get:
      tags:
        - Games
        - Unity
      description: Retorna os jogos do usuario
      operationId: getGames
      parameters:
        - name: id
          in: query
          description: Id do game a ser buscado
          schema:
            type: number
            example: 1
      responses:
        '200':
          description: Lista de jogos
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/GamesResponse'
      security:
        - authToken: [ ]
    put:
      tags:
        - Games
      description: Edita um game do usuario
      operationId: editGame
      requestBody:
        description: Dados do jogo a ser editado
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GamesCreate'
      parameters:
        - name: id
          in: query
          description: Id do game a ser editado
          schema:
            type: number
            example: 1
      responses:
        '200':
          description: GameEditado
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/GamesResponse'
      security:
        - authToken: [ ]
    post:
      tags:
        - Games
      description: Cria um novo game do usuario
      operationId: createGame
      requestBody:
        description: Dados do jogo a ser criado
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GamesCreate'
        required: true
      responses:
        '200':
          description: Game criado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GamesResponse'
      security:
        - authToken: [ ]
    delete:
      tags:
        - Games
      description: Deleta um jogo do usuario
      operationId: deleteGames
      parameters:
        - name: id
          in: query
          description: Id do game a ser deletado
          required: true
          schema:
            type: number
            example: 1
      responses:
        '200':
          description: Game excluido
      security:
        - authToken: [ ]
  /games/community:
    get:
      tags:
        - Games
      description: Retorna os jogos da comunidade
      operationId: getCommunityGames
      parameters:
        - name: name
          in: query
          description: Nome do game a ser buscado
          schema:
            type: string
            example: Teste 20
        - name: category
          in: query
          description: Categoria dos games a serem pesquisados
          schema:
            type: number
            example: 1
        - name: language
          in: query
          description: Lingua dos games a serem pesquisados
          schema:
            type: number
            example: 1
        - name: limit
          in: query
          description: Limite de games que a pesquisa vai retornar (por padrão é 5)
          schema:
            type: number
            example: 4
      responses:
        '200':
          description: Lista de jogos da comunidade
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/GamesResponse'
      security:
        - authToken: [ ]
  /games/duplicate:
    post:
      tags:
        - Games
      description: Duplica um game caso seja publico ou do proprio usuario
      operationId: duplicateGames
      parameters:
        - name: id
          in: query
          description: Id do game a ser duplicado
          schema:
            type: number
            example: 1
      responses:
        '200':
          description: id do Game que foi duplicado
          content:
            application/json:
              schema:
                oneOf:
                    - $ref: '#/components/schemas/GamesDuplicateResponse'
      security:
        - authToken: [ ]
  /games/visibility:
    post:
      tags:
        - Games
      description: Insere uma visibilidade para o game
      operationId: setVisibilityGame
      parameters:
        - name: id
          in: query
          description: Id do game que vamos trocar a visibilidade
          schema:
            type: number
            example: 1
      requestBody:
        description: Nova visibilidade do game
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/gameVisibility'
        required: true
      responses:
        '200':
          description: Visibilidade alterada com sucesso
      security:
        - authToken: [ ]
    get:
      tags:
        - Games
      description: Coleta a visibilidade de um jogo especifico
      operationId: getVisibilityGame
      parameters:
        - name: id
          in: query
          description: Id do game que vamos buscar a visibilidade
          schema:
            type: number
            example: 1
      responses:
        '200':
            description: Visibilidade do game
            content:
              application/json:
                schema:
                  oneOf:
                    - $ref: '#/components/schemas/gameVisibility'
      security:
        - authToken: [ ]
components:
  securitySchemes:
    authToken:
      type: apiKey
      name: Authorization
      in: header
  schemas:
    Contact:
      type: object
      properties:
        name:
          type: string
          description: Nome do usuario
          example: 'Julio'
        email:
          type: string
          description: Email do usuário
          example: 'teste@gmail.com'
        reason:
          type: string
          description: Motivo do contato
          example: 'Dúvida'
        message:
          type: string
          description: Mensagem de contato
          example: 'Me interessei pela plataforma'
      required:
        - name
        - email
        - message
        - reason
    Register:
      type: object
      properties:
        name:
          type: string
          description: Nome do usuario
          example: 'Julio'
        email:
          type: string
          description: Email do usuário
          example: 'teste@gmail.com'
        password:
          type: string
          description: Senha do usuário
          example: '123456'
        avatar:
            type: string
            description: Avatar do usuario
            example: 'avatar-01'
        description:
          type: string
          description: Descrição do usuario
          example: "Estudante de Ciencias da computação"
        city:
          type: string
          description: Cidade do usuario
          example: "Santa helena"
        educationLevel:
          type: string
          description: Nivel educacional
          example: "Ensino medio completo"
      required:
        - name
        - email
        - password
    RegisterEmail:
      type: object
      properties:
        email:
          type: string
          description: Email para registro
          example: 'teste@gmail.com'
        instituition:
          type: integer
          description: Id da instituição, apenas o nivel mais alto de permissão pode utilizar, caso contrario a instituição é a mesma de quem enviou
          example: 2
      required:
        - email
    ReSendEmails:
      type: object
      properties:
        emails:
          type: array
          items:
            type: string
            description: Email para registro
            example: 'teste@gmail.com'
      required:
        - email
    Login:
      type: object
      properties:
        email:
          type: string
          description: Email do usuário
          example: 'teste@gmail.com'
        password:
          type: string
          description: Senha do usuário
          example: '123456'
      required:
        - email
        - password
    EditPasswordUser:
      type: object
      properties:
        email:
          type: string
          description: Email do usuario
          example: info@gmail.com
        password:
          type: string
          description: Nova senha do usuario
          example: "12345678"
    EditUser:
      type: object
      properties:
        name:
          type: string
          description: Nome do usuario
          example: João
        city:
          type: string
          description: Cidade do usuario
          example: "Santa helena"
        educationLevel:
          type: string
          description: Nivel educacional
          example: "Ensino medio completo"
        description:
          type: string
          description: Descrição do usuario
          example: "Estudante de Ciencias da computação"
        avatar:
          type: string
          description: Avatar do usuario
          example: 'avatar-01'
      required:
        - name
        - city
        - educationLevel
        - description
        - avatar
    Category:
      type: object
      properties:
        id:
          type: integer
          description: Id do nivel de ensiono / tema / categoria / subcategoria
          example: 1
        name:
          type: string
          description: Nome do nivel de ensino / tema / categoria / subcategoria
          example: 'Artes'
    Language:
      type: object
      properties:
        id:
          type: integer
          description: Id da linguagem
          example: 1
        name:
          type: string
          description: Nome da linguagem
          example: 'Portugues'
    Match:
      type: object
      properties:
        id:
          type: integer
          description: Id do match
          example: 79
        game:
          type: object
          properties:
            id:
              type: integer
              description: Id do jogo
              example: 1
            language:
              type: object
              properties:
                id:
                  type: integer
                  description: Id do idioma
                  example: 1
                name:
                  type: string
                  description: Nome do idioma
                  example: Portugues
            teaching_level:
              type: object
              properties:
                id:
                  type: integer
                  description: Id do nivel de ensino
                  example: 5
                name:
                    type: string
                    description: Nome do nivel de ensino
                    example: Ensino médio
            theme:
              type: object
              properties:
                id:
                  type: integer
                  description: Id do tema
                  example: 12
                name:
                  type: string
                  description: Nome do tema
                  example: Ciências Agrárias
            category:
              type: object
              properties:
                id:
                  type: integer
                  description: Id da categoria
                  example: 39
                name:
                  type: string
                  description: Nome da categoria
                  example: Agronomia
            subcategory:
              type: object
              properties:
                id:
                  type: integer
                  description: Id da subcategoria
                  example: 24
                name:
                  type: string
                  description: Nome da subcategoria
                  example: Fitotecnia
            author:
              type: object
              properties:
                id:
                  type: integer
                  description: Id do autor
                  example: 1
                name:
                  type: string
                  description: Nome do autor
                  example: Jõao
            num_questions:
              type: integer
              description: Numero de questões do jogo
              example: 5
            name:
              type: string
              description: Nome do jogo
              example: Jogo 1
            description:
              type: string
              description: descrição do jogo
              example: Contem questões sobre python
            questions:
              type: array
              description: Questões presentes no jogo
              items:
                type: object
                properties:
                  text:
                    type: string
                    description: Questão do game
                    example: Quanto é 1 + 1
                  tip:
                    type: string
                    description: Dica da questão
                    example: Depois do um...
                  answers:
                    type: string
                    description: Respostas do jogo
                    example:
                      - "1"
                      - "2"
                      - "3"
                      - "4"
                  answer:
                    type: integer
                    description: index da posição onde se encontra a resposta do jogo
                    example: 1
                  time:
                    type: integer
                    description: Tempo em segundos para a resposta
                    example: 60
                  img:
                    type: string
                    description: Imagem do game caso exista
                    example: https://static.api.ebattle.lamia-edu.com/games/questions/2023/04/09/168-202018-0.png
                required:
                  - text
                  - answers
                  - answer
                  - time
        spaces:
          type: integer
          description: Numero de casas do tabuleiro
          example: 1
        groups:
          type: array
          description: grupos que vão jogar
          items:
            type: object
            properties:
              name:
                type: string
                description: nome do grupo
                example: grupo 1
              players:
                type: string
                description: nome dos jogadores
                example:
                  - "Erik"
                  - "Ronaldo"
                  - "Armando"
                  - "Gustavo"
            required:
              - name
              - players
        trivia:
          type: boolean
          description: Modifica o jogo para que todos os personagens respondam a pergunta ao mesmo tempo
          example: false
        random:
          type: boolean
          description: Perguntas aparecem na mesma ordem que foram enviadas, ou embaralhadas
          example: false
      required:
        - spaces
        - game
        - groups
    StartMatch:
      type: object
      properties:
        spaces:
          type: integer
          description: Numero de casas do tabuleiro
          example: 1
        game:
          type: integer
          description: Id do jogo
          example: 1
        groups:
          type: array
          description: grupos que vão jogar
          items:
            type: object
            properties:
              name:
                type: string
                description: nome do grupo
                example: grupo 1
              players:
                type: array
                items:
                  type: string
                description: nome dos jogadores
                example:
                  - "Erik"
                  - "Ronaldo"
                  - "Armando"
                  - "Gustavo"
            required:
              - name
              - players
        trivia:
          type: boolean
          description: Modifica o jogo para que todos os personagens respondam a pergunta ao mesmo tempo
          example: false
        random:
          type: boolean
          description: Perguntas aparecem na mesma ordem que foram enviadas, ou embaralhadas
          example: false
      required:
        - spaces
        - game
        - groups
    SaveMatch:
      type: object
      properties:
        match:
          type: integer
          description: id do match alvo
          example: 33
        podium:
          type: array
          description: Posições dos grupos no pódio
          items:
            type: object
